version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: shina-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./shina-mcp-projeto
      dockerfile: Dockerfile
    container_name: shina-api
    environment:
      REDIS_URL: "redis://redis:6379/0"
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      - redis
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard:
    build:
      context: ./hydroponic-system-dashboard
      dockerfile: Dockerfile
    container_name: shina-dashboard
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:8080"
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: hydroponic-mcp
    command: tail -f /dev/null
    depends_on:
      - redis
    restart: unless-stopped
